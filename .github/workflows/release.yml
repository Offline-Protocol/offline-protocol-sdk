name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip publish steps)'
        type: boolean
        default: true
      version:
        description: 'Version override (e.g., 0.9.1) — required for branch-based dry runs'
        type: string
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  UNIFFI_VERSION: "0.30.0"

jobs:
  build-ios:
    name: Build iOS Libraries
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-ios

      - name: Cache uniffi-bindgen
        id: cache-uniffi
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/uniffi-bindgen
          key: uniffi-bindgen-${{ runner.os }}-${{ env.UNIFFI_VERSION }}

      - name: Install uniffi-bindgen
        if: steps.cache-uniffi.outputs.cache-hit != 'true'
        run: cargo install uniffi --version ${{ env.UNIFFI_VERSION }} --features cli --locked

      - name: Build iOS Libraries
        working-directory: bindings/react-native
        run: bash scripts/build-uniffi-ios.sh

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-libs
          path: |
            bindings/react-native/ios/libs/
            bindings/react-native/ios/Generated/
          retention-days: 1

  # Build each Android ABI in parallel instead of sequentially
  build-android:
    name: Build Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            linker_env: CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER
            linker_bin: aarch64-linux-android21-clang
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            linker_env: CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER
            linker_bin: armv7a-linux-androideabi21-clang
          - abi: x86_64
            target: x86_64-linux-android
            linker_env: CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER
            linker_bin: x86_64-linux-android21-clang
          - abi: x86
            target: i686-linux-android
            linker_env: CARGO_TARGET_I686_LINUX_ANDROID_LINKER
            linker_bin: i686-linux-android21-clang
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-android-${{ matrix.abi }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      # Safe: matrix values are author-controlled literals, not external input
      - name: Build ${{ matrix.abi }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          NDK_TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export ${{ matrix.linker_env }}="$NDK_TOOLCHAIN/${{ matrix.linker_bin }}"
          export AR="$NDK_TOOLCHAIN/llvm-ar"

          cargo build --release --locked --target ${{ matrix.target }} --package offline-protocol-uniffi

          mkdir -p jniLibs/${{ matrix.abi }}
          SO_ROOT="target/${{ matrix.target }}/release"
          if [ -f "$SO_ROOT/liboffline_protocol_uniffi.so" ]; then
            cp "$SO_ROOT/liboffline_protocol_uniffi.so" "jniLibs/${{ matrix.abi }}/libuniffi_offline_protocol.so"
          elif [ -f "$SO_ROOT/deps/liboffline_protocol_uniffi.so" ]; then
            cp "$SO_ROOT/deps/liboffline_protocol_uniffi.so" "jniLibs/${{ matrix.abi }}/libuniffi_offline_protocol.so"
          else
            echo "ERROR: liboffline_protocol_uniffi.so not found in $SO_ROOT or $SO_ROOT/deps"
            ls -la "$SO_ROOT"/ "$SO_ROOT/deps"/ 2>/dev/null || true
            exit 1
          fi

      - name: Upload ${{ matrix.abi }} library
        uses: actions/upload-artifact@v4
        with:
          name: android-jniLibs-${{ matrix.abi }}
          path: jniLibs/
          retention-days: 1

  # Generate Kotlin bindings in parallel with builds (only needs UDL file, not compiled code)
  android-bindings:
    name: Generate Android Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache uniffi-bindgen
        id: cache-uniffi
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/uniffi-bindgen
          key: uniffi-bindgen-${{ runner.os }}-${{ env.UNIFFI_VERSION }}

      - name: Install uniffi-bindgen
        if: steps.cache-uniffi.outputs.cache-hit != 'true'
        run: cargo install uniffi --version ${{ env.UNIFFI_VERSION }} --features cli --locked

      - name: Generate Kotlin bindings
        run: |
          cd crates/offline-protocol-uniffi
          uniffi-bindgen generate src/offline_protocol.udl --language kotlin --out-dir ../../android-bindings

      - name: Upload Android Bindings
        uses: actions/upload-artifact@v4
        with:
          name: android-uniffi-bindings
          path: android-bindings/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Desktop builds (macOS / Linux / Windows)
  # ---------------------------------------------------------------------------

  build-desktop-macos:
    name: Build Desktop (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-14
            lib_name: liboffline_protocol_uniffi.dylib
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-13
            lib_name: liboffline_protocol_uniffi.dylib
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-desktop-macos-${{ matrix.arch }}

      - name: Build cdylib
        run: cargo build --release --locked --target ${{ matrix.target }} --package offline-protocol-uniffi

      - name: Collect artifact
        run: |
          mkdir -p desktop-libs/macos-${{ matrix.arch }}
          SO_ROOT="target/${{ matrix.target }}/release"
          if [ -f "$SO_ROOT/${{ matrix.lib_name }}" ]; then
            cp "$SO_ROOT/${{ matrix.lib_name }}" "desktop-libs/macos-${{ matrix.arch }}/"
          elif [ -f "$SO_ROOT/deps/${{ matrix.lib_name }}" ]; then
            cp "$SO_ROOT/deps/${{ matrix.lib_name }}" "desktop-libs/macos-${{ matrix.arch }}/"
          else
            echo "ERROR: ${{ matrix.lib_name }} not found"
            ls -la "$SO_ROOT"/ "$SO_ROOT/deps"/ 2>/dev/null || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: desktop-libs/
          retention-days: 1

  build-desktop-linux:
    name: Build Desktop (Linux ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            lib_name: liboffline_protocol_uniffi.so
            cross: false
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            lib_name: liboffline_protocol_uniffi.so
            cross: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-desktop-linux-${{ matrix.arch }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build cdylib
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --locked --target ${{ matrix.target }} --package offline-protocol-uniffi

      - name: Collect artifact
        run: |
          mkdir -p desktop-libs/linux-${{ matrix.arch }}
          SO_ROOT="target/${{ matrix.target }}/release"
          if [ -f "$SO_ROOT/${{ matrix.lib_name }}" ]; then
            cp "$SO_ROOT/${{ matrix.lib_name }}" "desktop-libs/linux-${{ matrix.arch }}/"
          elif [ -f "$SO_ROOT/deps/${{ matrix.lib_name }}" ]; then
            cp "$SO_ROOT/deps/${{ matrix.lib_name }}" "desktop-libs/linux-${{ matrix.arch }}/"
          else
            echo "ERROR: ${{ matrix.lib_name }} not found"
            ls -la "$SO_ROOT"/ "$SO_ROOT/deps"/ 2>/dev/null || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: desktop-libs/
          retention-days: 1

  build-desktop-windows:
    name: Build Desktop (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-desktop-windows

      - name: Build cdylib
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --package offline-protocol-uniffi

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p desktop-libs/windows-x86_64
          SO_ROOT="target/x86_64-pc-windows-msvc/release"
          if [ -f "$SO_ROOT/offline_protocol_uniffi.dll" ]; then
            cp "$SO_ROOT/offline_protocol_uniffi.dll" "desktop-libs/windows-x86_64/"
          elif [ -f "$SO_ROOT/deps/offline_protocol_uniffi.dll" ]; then
            cp "$SO_ROOT/deps/offline_protocol_uniffi.dll" "desktop-libs/windows-x86_64/"
          else
            echo "ERROR: offline_protocol_uniffi.dll not found"
            ls -la "$SO_ROOT"/ "$SO_ROOT/deps"/ 2>/dev/null || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x86_64
          path: desktop-libs/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Python bindings generation & testing
  # ---------------------------------------------------------------------------

  python-bindings:
    name: Generate Python Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache uniffi-bindgen
        id: cache-uniffi
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/uniffi-bindgen
          key: uniffi-bindgen-${{ runner.os }}-${{ env.UNIFFI_VERSION }}

      - name: Install uniffi-bindgen
        if: steps.cache-uniffi.outputs.cache-hit != 'true'
        run: cargo install uniffi --version ${{ env.UNIFFI_VERSION }} --features cli --locked

      - name: Generate Python bindings
        run: |
          cd crates/offline-protocol-uniffi
          uniffi-bindgen generate src/offline_protocol.udl --language python --out-dir ../../bindings/python/offline_protocol_sdk/

      - uses: actions/upload-artifact@v4
        with:
          name: python-bindings
          path: bindings/python/offline_protocol_sdk/offline_protocol.py
          retention-days: 1

  test-python:
    name: Test Python Bindings
    needs: [python-bindings, build-desktop-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Python bindings
        uses: actions/download-artifact@v4
        with:
          name: python-bindings
          path: bindings/python/offline_protocol_sdk/

      - name: Download Linux x86_64 library
        uses: actions/download-artifact@v4
        with:
          name: desktop-linux-x86_64
          path: native-libs/

      - name: Install and test
        run: |
          cp native-libs/linux-x86_64/liboffline_protocol_uniffi.so bindings/python/offline_protocol_sdk/
          cd bindings/python/offline_protocol_sdk && ln -sf liboffline_protocol_uniffi.so libuniffi.so && cd ..
          pip install -e ".[dev]"
          pytest tests/ -v

  audit-python:
    name: Audit Python Dependencies
    needs: [python-bindings]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit for known CVEs
        run: |
          cd bindings/python
          pip install pip-audit
          pip install bleak websockets keyring
          pip-audit --strict

  python-package:
    name: Package Python (${{ matrix.platform }})
    needs: [build-desktop-macos, build-desktop-linux, build-desktop-windows, python-bindings]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            artifact: desktop-macos-arm64
            lib_subdir: macos-arm64
            plat_name: macosx_14_0_arm64
          - platform: macos-x86_64
            artifact: desktop-macos-x86_64
            lib_subdir: macos-x86_64
            plat_name: macosx_13_0_x86_64
          - platform: linux-x86_64
            artifact: desktop-linux-x86_64
            lib_subdir: linux-x86_64
            plat_name: manylinux_2_17_x86_64
          - platform: linux-aarch64
            artifact: desktop-linux-aarch64
            lib_subdir: linux-aarch64
            plat_name: manylinux_2_17_aarch64
          - platform: windows-x86_64
            artifact: desktop-windows-x86_64
            lib_subdir: windows-x86_64
            plat_name: win_amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Python bindings
        uses: actions/download-artifact@v4
        with:
          name: python-bindings
          path: bindings/python/offline_protocol_sdk/

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: native-libs/

      - name: Build wheel
        run: |
          cp native-libs/${{ matrix.lib_subdir }}/* bindings/python/offline_protocol_sdk/
          # Create symlink matching the name generated Python expects (libuniffi.*)
          cd bindings/python/offline_protocol_sdk
          for lib in *.dylib; do [ -f "$lib" ] && ln -sf "$lib" libuniffi.dylib; done
          for lib in *.so; do [ -f "$lib" ] && ln -sf "$lib" libuniffi.so; done
          for lib in *.dll; do [ -f "$lib" ] && ln -sf "$lib" uniffi.dll; done
          cd ..
          pip install build wheel
          python -m build --wheel
          # Re-tag the wheel with the correct platform
          pip install wheel
          python -c "
          import glob, pathlib, wheel.wheelfile
          for whl in glob.glob('dist/*.whl'):
              print(f'Built: {whl}')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.platform }}
          path: bindings/python/dist/*.whl
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------------------

  release:
    name: Create Release & Publish to npm
    needs: [build-ios, build-android, android-bindings, build-desktop-macos, build-desktop-linux, build-desktop-windows, python-bindings, test-python, audit-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pre-built binary — no Rust toolchain needed
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        run: git-cliff --latest --strip header -o RELEASE_NOTES.md

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-libs
          path: bindings/react-native/ios

      - name: Download Android Libraries
        uses: actions/download-artifact@v4
        with:
          pattern: android-jniLibs-*
          path: bindings/react-native/android/src/main/jniLibs
          merge-multiple: true

      - name: Download Android Bindings
        uses: actions/download-artifact@v4
        with:
          name: android-uniffi-bindings
          path: bindings/react-native/android/src/main/java

      - name: Verify artifacts
        run: |
          echo "Checking iOS artifacts..."
          test -f bindings/react-native/ios/libs/liboffline_protocol_uniffi_device.a
          test -f bindings/react-native/ios/libs/liboffline_protocol_uniffi_sim.a
          test -d bindings/react-native/ios/Generated

          echo "Checking Android native libraries..."
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            test -f "bindings/react-native/android/src/main/jniLibs/$abi/libuniffi_offline_protocol.so"
          done

          echo "Checking Android Kotlin bindings..."
          test -d bindings/react-native/android/src/main/java/uniffi

          echo "All artifacts verified."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Get version from tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$INPUT_VERSION" ]]; then
            echo "VERSION=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Update package.json version
        working-directory: bindings/react-native
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        working-directory: bindings/react-native
        run: npm ci

      - name: Build TypeScript
        working-directory: bindings/react-native
        run: npm run build

      - name: Validate package
        working-directory: bindings/react-native
        run: bash scripts/prepare-npm.sh

      - name: Create GitHub Release
        if: inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: inputs.dry_run != true
        working-directory: bindings/react-native
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
