name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip publish steps)'
        type: boolean
        default: true
      version:
        description: 'Version override (e.g., 0.9.1) — required for branch-based dry runs'
        type: string
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep in sync with the `uniffi` pin in crates/offline-protocol-uniffi/Cargo.toml.
  # scripts/generate-bindings.sh compares the two and fails the build on a
  # minor-version disagreement, so drift here is loud rather than silent — but
  # a uniffi bump still means editing several files that name the version
  # prescriptively (this, ci.yml, README, CLAUDE.md, CONTRIBUTING.md and the
  # install hints the scripts print).
  UNIFFI_VERSION: "0.30.0"

# ---------------------------------------------------------------------------
# Third-party action pinning
#
# Every third-party action below, and every `actions/*` action in the `release`
# job, is pinned to an immutable commit SHA with the human-readable version in
# the trailing comment. A tag like `@v3` is a mutable pointer the upstream owner
# can re-point at any commit, so an upstream account compromise lands in the next
# release build with no change on our side and nothing in the diff to review.
#
# This workflow is where that matters most, and the blast radius is wider than
# "a bad binary":
#   - The `release` job holds `contents: write` (publishes the GitHub release),
#     `id-token: write` and `attestations: write` (mints GitHub attestations and
#     npm provenance), and reads NPM_TOKEN. Anything running there can sign a
#     forged artifact with this workflow's own identity — which is exactly the
#     signal consumers are told to trust over SHA256SUMS.txt.
#   - The `publish-crates` job reads CARGO_REGISTRY_TOKEN. Anything running
#     there can publish arbitrary code to crates.io under this project's crate
#     names — and crates.io versions are immutable, so a poisoned publish can
#     only be yanked, never replaced.
#   - The build jobs hold no credentials, but they produce the .a/.so/.dylib/.dll
#     that the release job then attests. Tampering there launders a backdoor
#     through our provenance rather than around it.
#
# `actions/*` is GitHub's own org, served from the same trust root as the runner
# and the token, so in the credential-free build jobs it is deliberately left on
# major tags. The `release` and `publish-crates` jobs are the exceptions,
# because there the argument above turns back on itself:
# `attest-build-provenance` is the action that *mints* the signature consumers
# are told to trust, `download-artifact` is what hands it the binaries to sign,
# `setup-node` configures the registry the NPM_TOKEN publish authenticates
# against, and `checkout` decides which source gets packaged into the .crate
# files CARGO_REGISTRY_TOKEN uploads. Leaving those mutable would reopen
# exactly the hole the rest of this pinning closes. Org membership does not cover
# it either — the attack that actually happens is tag re-pointing from a
# compromised maintainer account (tj-actions/changed-files, March 2025), not a
# breach of GitHub itself. All of them publish semver tags, so Dependabot keeps
# these current. cla.yml pins its one third-party action the same way.
#
# To bump: replace the SHA and the trailing version comment together. Dependabot
# does this automatically for actions that publish semver tags (`github-actions`
# ecosystem in .github/dependabot.yml). Verify a SHA with:
#   gh api repos/<owner>/<repo>/commits/<sha> --jq .commit.message
#
# dtolnay/rust-toolchain is the exception to both halves of that. Its only tag is
# a stale major `v1` (e97e2d8, Aug 2025) — it publishes no per-release tags, and
# `stable` is a *branch*, so the pin is that branch's head and the trailing
# comment names the branch rather than a version. It is also on dependabot.yml's
# ignore list, which does double duty: it keeps ci.yml's MSRV pin intact, and it
# stops Dependabot re-pointing the SHAs below at that year-old `v1`. So these are
# bumped by hand; re-pin from
# `gh api repos/dtolnay/rust-toolchain/commits/stable`.
# Pinning does not freeze the Rust version — rustup still resolves `stable` at
# run time — but it does freeze which toolchain the action *defaults* to, which
# the ref used to carry and a SHA does not. Hence the explicit `toolchain:
# stable` at every call site: without it, re-pinning from a version branch such
# as `1.87.0` would silently change the toolchain instead of failing loudly.
# ---------------------------------------------------------------------------

jobs:
  build-ios:
    name: Build iOS Libraries
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-ios

      - name: Cache uniffi-bindgen
        id: cache-uniffi
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/uniffi-bindgen
          key: uniffi-bindgen-${{ runner.os }}-${{ env.UNIFFI_VERSION }}

      - name: Install uniffi-bindgen
        if: steps.cache-uniffi.outputs.cache-hit != 'true'
        run: cargo install uniffi --version ${{ env.UNIFFI_VERSION }} --features cli --locked

      - name: Build iOS Libraries
        working-directory: bindings/react-native
        run: bash scripts/build-uniffi-ios.sh

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ios-libs
          path: |
            bindings/react-native/ios/libs/
            bindings/react-native/ios/Generated/
          retention-days: 1

  # Build each Android ABI in parallel instead of sequentially
  build-android:
    name: Build Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            linker_env: CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER
            linker_bin: aarch64-linux-android21-clang
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            linker_env: CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER
            linker_bin: armv7a-linux-androideabi21-clang
          - abi: x86_64
            target: x86_64-linux-android
            linker_env: CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER
            linker_bin: x86_64-linux-android21-clang
          - abi: x86
            target: i686-linux-android
            linker_env: CARGO_TARGET_I686_LINUX_ANDROID_LINKER
            linker_bin: i686-linux-android21-clang
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-android-${{ matrix.abi }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      # Safe: matrix values are author-controlled literals, not external input
      - name: Build ${{ matrix.abi }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          NDK_TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export ${{ matrix.linker_env }}="$NDK_TOOLCHAIN/${{ matrix.linker_bin }}"
          export AR="$NDK_TOOLCHAIN/llvm-ar"

          cargo build --release --locked --target ${{ matrix.target }} --package offline-protocol-uniffi

          mkdir -p jniLibs/${{ matrix.abi }}
          SO_ROOT="target/${{ matrix.target }}/release"
          if [ -f "$SO_ROOT/liboffline_protocol_uniffi.so" ]; then
            cp "$SO_ROOT/liboffline_protocol_uniffi.so" "jniLibs/${{ matrix.abi }}/libuniffi_offline_protocol.so"
          elif [ -f "$SO_ROOT/deps/liboffline_protocol_uniffi.so" ]; then
            cp "$SO_ROOT/deps/liboffline_protocol_uniffi.so" "jniLibs/${{ matrix.abi }}/libuniffi_offline_protocol.so"
          else
            echo "ERROR: liboffline_protocol_uniffi.so not found in $SO_ROOT or $SO_ROOT/deps"
            ls -la "$SO_ROOT"/ "$SO_ROOT/deps"/ 2>/dev/null || true
            exit 1
          fi

          # Google Play requires 16 KB page-size alignment (flags live in
          # .cargo/config.toml); fail this ABI's build rather than ship 4 KB.
          python3 bindings/react-native/scripts/check-elf-alignment.py \
            "jniLibs/${{ matrix.abi }}/libuniffi_offline_protocol.so"

      - name: Upload ${{ matrix.abi }} library
        uses: actions/upload-artifact@v7
        with:
          name: android-jniLibs-${{ matrix.abi }}
          path: jniLibs/
          retention-days: 1

  # Generate Kotlin bindings in parallel with builds (only needs UDL file, not compiled code)
  android-bindings:
    name: Generate Android Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache uniffi-bindgen
        id: cache-uniffi
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/uniffi-bindgen
          key: uniffi-bindgen-${{ runner.os }}-${{ env.UNIFFI_VERSION }}

      - name: Install uniffi-bindgen
        if: steps.cache-uniffi.outputs.cache-hit != 'true'
        run: cargo install uniffi --version ${{ env.UNIFFI_VERSION }} --features cli --locked

      # The Kotlin this job uploads is downloaded *over* the committed Android
      # bindings in the publish job, so it — not the committed file — is what
      # ships to npm. It therefore has to be produced the same way CI's drift
      # gate verified: same bindgen, same --no-format, generated alongside the
      # Swift and Python it shares FFI checksums with. Generating it directly
      # here would also skip the script's check that the installed bindgen
      # agrees with the crate's uniffi pin to the minor version, which is what
      # stands between UNIFFI_VERSION drifting from Cargo.toml and a released
      # package whose Kotlin checksums fail at the app's first FFI call.
      #
      # Staged into android-bindings/ so the uploaded artifact keeps the
      # uniffi/... root the publish job's download path expects.
      - name: Generate Kotlin bindings
        run: |
          bash scripts/generate-bindings.sh
          mkdir -p android-bindings
          cp -R bindings/react-native/android/src/main/java/uniffi android-bindings/

      - name: Upload Android Bindings
        uses: actions/upload-artifact@v7
        with:
          name: android-uniffi-bindings
          path: android-bindings/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Desktop builds (macOS / Linux / Windows)
  # ---------------------------------------------------------------------------

  build-desktop-macos:
    name: Build Desktop (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-14
            lib_name: liboffline_protocol_uniffi.dylib
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-desktop-macos-${{ matrix.arch }}

      - name: Build cdylib
        run: cargo build --release --locked --target ${{ matrix.target }} --package offline-protocol-uniffi

      - name: Collect artifact
        run: |
          mkdir -p desktop-libs/macos-${{ matrix.arch }}
          SO_ROOT="target/${{ matrix.target }}/release"
          if [ -f "$SO_ROOT/${{ matrix.lib_name }}" ]; then
            cp "$SO_ROOT/${{ matrix.lib_name }}" "desktop-libs/macos-${{ matrix.arch }}/"
          elif [ -f "$SO_ROOT/deps/${{ matrix.lib_name }}" ]; then
            cp "$SO_ROOT/deps/${{ matrix.lib_name }}" "desktop-libs/macos-${{ matrix.arch }}/"
          else
            echo "ERROR: ${{ matrix.lib_name }} not found"
            ls -la "$SO_ROOT"/ "$SO_ROOT/deps"/ 2>/dev/null || true
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: desktop-libs/
          retention-days: 1

  build-desktop-linux:
    name: Build Desktop (Linux ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            lib_name: liboffline_protocol_uniffi.so
            cross: false
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            lib_name: liboffline_protocol_uniffi.so
            cross: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-desktop-linux-${{ matrix.arch }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build cdylib
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --locked --target ${{ matrix.target }} --package offline-protocol-uniffi

      - name: Collect artifact
        run: |
          mkdir -p desktop-libs/linux-${{ matrix.arch }}
          SO_ROOT="target/${{ matrix.target }}/release"
          if [ -f "$SO_ROOT/${{ matrix.lib_name }}" ]; then
            cp "$SO_ROOT/${{ matrix.lib_name }}" "desktop-libs/linux-${{ matrix.arch }}/"
          elif [ -f "$SO_ROOT/deps/${{ matrix.lib_name }}" ]; then
            cp "$SO_ROOT/deps/${{ matrix.lib_name }}" "desktop-libs/linux-${{ matrix.arch }}/"
          else
            echo "ERROR: ${{ matrix.lib_name }} not found"
            ls -la "$SO_ROOT"/ "$SO_ROOT/deps"/ 2>/dev/null || true
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: desktop-libs/
          retention-days: 1

  build-desktop-windows:
    name: Build Desktop (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-desktop-windows

      - name: Build cdylib
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --package offline-protocol-uniffi

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p desktop-libs/windows-x86_64
          SO_ROOT="target/x86_64-pc-windows-msvc/release"
          if [ -f "$SO_ROOT/offline_protocol_uniffi.dll" ]; then
            cp "$SO_ROOT/offline_protocol_uniffi.dll" "desktop-libs/windows-x86_64/"
          elif [ -f "$SO_ROOT/deps/offline_protocol_uniffi.dll" ]; then
            cp "$SO_ROOT/deps/offline_protocol_uniffi.dll" "desktop-libs/windows-x86_64/"
          else
            echo "ERROR: offline_protocol_uniffi.dll not found"
            ls -la "$SO_ROOT"/ "$SO_ROOT/deps"/ 2>/dev/null || true
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-x86_64
          path: desktop-libs/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Python bindings generation & testing
  # ---------------------------------------------------------------------------

  python-bindings:
    name: Generate Python Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache uniffi-bindgen
        id: cache-uniffi
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/uniffi-bindgen
          key: uniffi-bindgen-${{ runner.os }}-${{ env.UNIFFI_VERSION }}

      - name: Install uniffi-bindgen
        if: steps.cache-uniffi.outputs.cache-hit != 'true'
        run: cargo install uniffi --version ${{ env.UNIFFI_VERSION }} --features cli --locked

      # Generates all three languages; only the Python file is uploaded here.
      # Going through the shared script keeps the released wheel's bindings
      # produced exactly the way CI's drift gate verified them, and picks up its
      # check that uniffi-bindgen agrees with the crate's uniffi pin to the
      # minor version — enough to catch UNIFFI_VERSION drifting from Cargo.toml,
      # which would otherwise ship bindings whose checksums fail at the app's
      # first call. Patch drift is deliberately tolerated: uniffi's FFI contract
      # version is not patch-scoped.
      - name: Generate Python bindings
        run: bash scripts/generate-bindings.sh

      - uses: actions/upload-artifact@v7
        with:
          name: python-bindings
          path: bindings/python/offline_protocol_sdk/offline_protocol.py
          retention-days: 1

  test-python:
    name: Test Python Bindings
    needs: [python-bindings, build-desktop-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download Python bindings
        uses: actions/download-artifact@v8
        with:
          name: python-bindings
          path: bindings/python/offline_protocol_sdk/

      - name: Download Linux x86_64 library
        uses: actions/download-artifact@v8
        with:
          name: desktop-linux-x86_64
          path: native-libs/

      - name: Install and test
        run: |
          cp native-libs/linux-x86_64/liboffline_protocol_uniffi.so bindings/python/offline_protocol_sdk/
          cd bindings/python/offline_protocol_sdk && ln -sf liboffline_protocol_uniffi.so libuniffi.so && cd ..
          pip install -e ".[dev]"
          pytest tests/ -v

  audit-python:
    name: Audit Python Dependencies
    needs: [python-bindings]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Audit for known CVEs
        run: |
          cd bindings/python
          pip install pip-audit
          pip install bleak websockets keyring
          pip-audit --strict

  python-package:
    name: Package Python (${{ matrix.platform }})
    needs: [build-desktop-macos, build-desktop-linux, build-desktop-windows, python-bindings]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            artifact: desktop-macos-arm64
            lib_subdir: macos-arm64
            plat_name: macosx_14_0_arm64
          - platform: linux-x86_64
            artifact: desktop-linux-x86_64
            lib_subdir: linux-x86_64
            plat_name: manylinux_2_17_x86_64
          - platform: linux-aarch64
            artifact: desktop-linux-aarch64
            lib_subdir: linux-aarch64
            plat_name: manylinux_2_17_aarch64
          - platform: windows-x86_64
            artifact: desktop-windows-x86_64
            lib_subdir: windows-x86_64
            plat_name: win_amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download Python bindings
        uses: actions/download-artifact@v8
        with:
          name: python-bindings
          path: bindings/python/offline_protocol_sdk/

      - name: Download native library
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: native-libs/

      - name: Build wheel
        run: |
          cp native-libs/${{ matrix.lib_subdir }}/* bindings/python/offline_protocol_sdk/
          # Create symlink matching the name generated Python expects (libuniffi.*)
          cd bindings/python/offline_protocol_sdk
          for lib in *.dylib; do [ -f "$lib" ] && ln -sf "$lib" libuniffi.dylib; done
          for lib in *.so; do [ -f "$lib" ] && ln -sf "$lib" libuniffi.so; done
          for lib in *.dll; do [ -f "$lib" ] && ln -sf "$lib" uniffi.dll; done
          cd ..
          pip install build wheel
          python -m build --wheel
          # Re-tag the wheel with the correct platform
          pip install wheel
          python -c "
          import glob, pathlib, wheel.wheelfile
          for whl in glob.glob('dist/*.whl'):
              print(f'Built: {whl}')
          "

      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.platform }}
          path: bindings/python/dist/*.whl
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Release gate
  # ---------------------------------------------------------------------------

  # One number identifies a release on every channel — the `vX.Y.Z` tag, the npm
  # package, the crates on crates.io — and this job refuses the release when the
  # repo and the tag disagree about what that number is.
  #
  # It gates *both* publish jobs, and that is the whole reason it is a job at all
  # rather than a step inside `publish-crates`, where this check started out.
  # The two publish jobs are independent siblings behind an identical `needs`
  # list, so a check living in one has no hold over the other. For every other
  # way `publish-crates` can fail — a missing token, a rate limit, a dropped
  # connection — that independence is harmless, because those are all
  # recoverable by re-running the job against the same tag. A forgotten version
  # bump is the exception, and it is also the mistake this whole design invites:
  # every release through v0.20.1 was cut without touching Cargo.toml at all.
  # Checked inside the crates job, it fails there in seconds while the npm job
  # publishes that number to npm and cuts the GitHub release anyway — and
  # nothing recovers that. Re-running checks out the same unbumped source, and
  # moving the tag onto a bumped commit is precisely the force-move CONTRIBUTING
  # now forbids. The number would be burned and the release split across
  # registries permanently.
  #
  # Hoisted here, that same mistake fails the entire release with nothing
  # published anywhere, and the tag can simply be deleted and re-pushed — which
  # is what the error annotations below tell you to do, and it is only true
  # because this job runs ahead of both.
  #
  # It `needs` nothing, so it reports within a minute of the tag push instead of
  # queueing behind the build fan-out. The CARGO_REGISTRY_TOKEN presence check
  # deliberately stays in `publish-crates`: that one *is* re-runnable on the same
  # tag, so it has no business blocking npm.
  version-gate:
    name: Verify Release Versions
    runs-on: ubuntu-latest
    steps:
      # Credential-free and artifact-free, so `actions/*` stays on a major tag
      # per the pinning note at the top of this file. A compromise here could
      # wave a version mismatch through; it could not publish anything, because
      # both publish jobs check out the source they package themselves.
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      # The crate version is the workspace version, and it must equal the tag —
      # the two version in lockstep with the npm package, so `offline-protocol
      # 0.21.0` on crates.io is the same release as `v0.21.0` and
      # `@offline-protocol/mesh-sdk@0.21.0`.
      #
      # This is verified rather than written. The npm job sets its version from
      # the tag, but the same trick is unavailable here and would be wrong
      # anyway: Cargo.lock pins the workspace members' own versions, so
      # rewriting the manifests at release time invalidates it and the --locked
      # packaging verification in `publish-crates` stops working — and the
      # published .crate would no longer match the tag it claims to come from,
      # which is the property the release attestations exist to make checkable.
      #
      # So the bump is part of the release cut (see CONTRIBUTING.md) and this
      # step is what makes forgetting it loud. Failing here costs a re-tag; not
      # failing costs a permanent, immutable, wrongly-numbered publish. Runs on
      # prerelease and dry-run tags too, where it is free rehearsal.
      #
      # pyproject.toml is checked alongside it because it tracks this same
      # number — it followed the Cargo version before crates.io publishing
      # existed, and leaving it unchecked is how it quietly becomes a third
      # scheme.
      - name: Verify the release versions match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          # A prerelease suffix lives on the tag only: v0.21.0-rc.1 rehearses
          # the 0.21.0 the workspace already carries. Compare the release cores.
          TAG_CORE="${TAG_VERSION%%-*}"
          TAG_CORE="${TAG_CORE%%+*}"

          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "offline-protocol") | .version')"

          if [ "$TAG_CORE" != "$CARGO_VERSION" ]; then
            echo "::error title=Workspace version does not match the tag::Tag v$TAG_VERSION wants crates at $TAG_CORE, but [workspace.package].version is $CARGO_VERSION. Bump it together with the seven internal-dependency versions in [workspace.dependencies], refresh Cargo.lock, then delete and re-push the tag. This gate runs ahead of both publish jobs, so nothing has shipped yet and re-tagging is still safe — which it stops being the moment a release publishes."
            exit 1
          fi

          # `|| true` so a missing or renamed key reports through the annotation
          # below rather than aborting the step with no explanation.
          PY_VERSION="$(grep -m1 '^version = ' bindings/python/pyproject.toml \
            | cut -d'"' -f2 || true)"

          if [ "$TAG_CORE" != "$PY_VERSION" ]; then
            echo "::error title=Python package version does not match the tag::Tag v$TAG_VERSION wants $TAG_CORE, but bindings/python/pyproject.toml reads '${PY_VERSION}'. It moves with the workspace version — bump it, then delete and re-push the tag (nothing has published yet)."
            exit 1
          fi

          echo "Workspace and Python versions ($CARGO_VERSION) match tag v$TAG_VERSION."

  # ---------------------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------------------

  release:
    name: Create Release & Publish to npm
    # `version-gate` is in this list, and not only in `publish-crates`, on
    # purpose: a version mismatch has to stop npm too. Left to fail the crates
    # job alone, it splits the release across registries with no way back — see
    # the long note on that job.
    needs: [version-gate, build-ios, build-android, android-bindings, build-desktop-macos, build-desktop-linux, build-desktop-windows, python-bindings, test-python, audit-python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Provenance for both distribution channels. Until now SHA256SUMS.txt was
      # the only integrity signal, and it sits on the same release page as the
      # binaries it covers — whoever can replace an asset can replace the
      # manifest in the same operation. Attestation and npm provenance are
      # signed by the workflow identity, so neither is forgeable from the
      # release page.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Pre-built binary — no Rust toolchain needed
      - uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          tool: git-cliff

      - name: Generate release notes
        run: git-cliff --latest --strip header -o RELEASE_NOTES.md

      - name: Download iOS Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-libs
          path: bindings/react-native/ios

      - name: Download Android Libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: android-jniLibs-*
          path: bindings/react-native/android/src/main/jniLibs
          merge-multiple: true

      - name: Download Android Bindings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-uniffi-bindings
          path: bindings/react-native/android/src/main/java

      # Not consumed by the npm package — these exist only to be attached to the
      # release. Each build-desktop job uploads under desktop-libs/<platform>/,
      # so merging the four is collision-free.
      - name: Download desktop libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: desktop-libs
          merge-multiple: true

      # Also not consumed by the npm package. The desktop archives carry this
      # module, because the cdylib alone is not usable: it is what calls into
      # the library, and until now it shipped only inside the Python wheels.
      - name: Download Python bindings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-bindings
          path: bindings/python/offline_protocol_sdk

      - name: Verify artifacts
        run: |
          echo "Checking iOS artifacts..."
          # Each slice is checked individually, not just the bundle: an
          # XCFramework carrying only the device slice still installs and still
          # builds for a device, so a missing simulator slice would ship
          # silently and read to consumers as "no simulator support".
          IOS_XCFRAMEWORK=bindings/react-native/ios/libs/offline_protocol_uniffi.xcframework
          test -f "$IOS_XCFRAMEWORK/Info.plist"
          test -f "$IOS_XCFRAMEWORK/ios-arm64/liboffline_protocol_uniffi.a"
          test -f "$IOS_XCFRAMEWORK/ios-arm64_x86_64-simulator/liboffline_protocol_uniffi.a"
          test -d bindings/react-native/ios/Generated

          echo "Checking Android native libraries..."
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            test -f "bindings/react-native/android/src/main/jniLibs/$abi/libuniffi_offline_protocol.so"
          done

          echo "Checking 16 KB page-size alignment (Google Play requirement)..."
          python3 bindings/react-native/scripts/check-elf-alignment.py \
            bindings/react-native/android/src/main/jniLibs/*/libuniffi_offline_protocol.so

          echo "Checking Android Kotlin bindings..."
          test -d bindings/react-native/android/src/main/java/uniffi

          # Checked here rather than at packaging time so a missing desktop slice
          # fails before anything is published, not between the GitHub release and
          # the npm publish.
          echo "Checking desktop libraries..."
          test -f desktop-libs/macos-arm64/liboffline_protocol_uniffi.dylib
          test -f desktop-libs/linux-x86_64/liboffline_protocol_uniffi.so
          test -f desktop-libs/linux-aarch64/liboffline_protocol_uniffi.so
          test -f desktop-libs/windows-x86_64/offline_protocol_uniffi.dll

          echo "Checking Python bindings..."
          test -s bindings/python/offline_protocol_sdk/offline_protocol.py

          echo "All artifacts verified."

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Get version from tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="0.0.0-dev"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid semantic version: $VERSION"
            exit 1
          fi

          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

          # A prerelease must not become what a plain `npm install` resolves to.
          # npm dist-tags every publish `latest` unless told otherwise, so
          # without this an `-rc` tag would quietly become the default version
          # for every consumer. That matters more now than it used to: the
          # crates job treats prerelease tags as free rehearsal — every gate and
          # the full packaging verification run, only the immutable upload is
          # skipped — which makes cutting one a reasonable thing to do rather
          # than a rarity.
          #
          # Derived from the resolved, semver-validated version rather than the
          # ref, so a branch dispatch off a hyphenated branch name cannot trip
          # it.
          if [[ "$VERSION" == *-* ]]; then
            NPM_TAG=next
          else
            NPM_TAG=latest
          fi
          printf 'NPM_TAG=%s\n' "$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION publishes under the '$NPM_TAG' npm dist-tag."

      - name: Update package.json version
        working-directory: bindings/react-native
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: npm version "$PACKAGE_VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        working-directory: bindings/react-native
        run: npm ci

      - name: Build TypeScript
        working-directory: bindings/react-native
        run: npm run build

      - name: Validate package
        working-directory: bindings/react-native
        run: bash scripts/prepare-npm.sh

      # Runs on dry runs too, so a packaging break surfaces before a tag is cut
      # rather than during one. Only the upload below is gated.
      #
      # The packaging itself lives in a script so it can be shellchecked and
      # exercised on every PR (ci.yml's "Release Packaging" job drives it
      # against a fixture tree, including the failure paths); this workflow only
      # ever runs on a `v*` tag, so inline logic would first execute during a
      # real release.
      - name: Package binary release assets
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: bash scripts/package-release-assets.sh

      # Signed by this workflow's identity, so it does not share the weakness of
      # SHA256SUMS.txt sitting next to the assets it covers. Consumers verify
      # with `gh attestation verify <asset> --repo ${{ github.repository }}`.
      - name: Attest release asset provenance
        if: inputs.dry_run != true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release-assets/*'

      - name: Create GitHub Release
        if: inputs.dry_run != true
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/*
            THIRD-PARTY-NOTICES.md
            EXPORT.md
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --provenance is the npm-side counterpart to the attestation above: it
      # publishes a signed link from the tarball back to this workflow run, so
      # the registry copy is verifiable too rather than trusted on the strength
      # of the publishing token alone.
      #
      # It is conditional because the registry refuses it from a private source
      # repository — "Unsupported GitHub Actions source repository visibility"
      # (HTTP 422), which failed the v0.20.1 publish after the GitHub release had
      # already been created. The rule is npm's, not ours, and it is coherent:
      # a provenance statement nobody can check against the named source proves
      # nothing. So the flag follows repository visibility rather than being
      # hardcoded either way, and this re-enables itself if the repo is ever made
      # public. Note the GitHub attestation above is unaffected — it verifies via
      # the API against the repo, so a private repo is fine there.
      #
      # Decided in its own always-running step so a dry run reports which branch a
      # real release would take; the publish itself is the only part dry runs skip.
      - name: Resolve npm provenance eligibility
        id: provenance
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          if [[ "$REPO_VISIBILITY" == "public" ]]; then
            echo "FLAG=--provenance" >> "$GITHUB_OUTPUT"
            echo "Source repository is public — publishing with provenance."
          else
            echo "FLAG=" >> "$GITHUB_OUTPUT"
            echo "::warning title=npm provenance skipped::Source repository visibility is \
          '${REPO_VISIBILITY:-unknown}'; npm accepts provenance only from public repositories, \
          so the tarball publishes without it. The GitHub release assets are still attested."
          fi

      - name: Publish to npm
        if: inputs.dry_run != true
        working-directory: bindings/react-native
        run: npm publish --access public --tag "$NPM_TAG" ${{ steps.provenance.outputs.FLAG }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.version.outputs.NPM_TAG }}

  # ---------------------------------------------------------------------------
  # crates.io
  # ---------------------------------------------------------------------------

  publish-crates:
    name: Publish to crates.io
    # Same gates as the npm release job, so the two publishes start together
    # and run in parallel — and nothing publishes to either registry unless
    # every build and test job is green and `version-gate` has agreed the repo
    # and the tag name the same version. This job consumes none of those
    # artifacts; the shared `needs` list exists purely for that all-or-nothing
    # property, and sharing it with `release` is what keeps a version mismatch
    # from failing one registry while the other publishes regardless.
    needs: [version-gate, build-ios, build-android, android-bindings, build-desktop-macos, build-desktop-linux, build-desktop-windows, python-bindings, test-python, audit-python]
    runs-on: ubuntu-latest
    env:
      # The single gate on every step that uploads. Four conditions, each
      # guarding a failure this registry cannot undo:
      #
      #   - a tag ref, because a `workflow_dispatch` from a branch with the
      #     dry-run box unchecked would otherwise publish branch code and burn
      #     the workspace version permanently. npm survives that mistake (72h
      #     unpublish window, and its version comes from the tag or falls to
      #     0.0.0-dev); crates.io has no equivalent escape.
      #   - not a dry run, matching the npm job.
      #   - no hyphen anywhere in the tag, because crates.io versions are
      #     immutable — a version can be yanked but never replaced — so an -rc
      #     tag must not burn the version its final tag will need.
      #   - no `+` either, by the same argument: `version-gate` strips build
      #     metadata before comparing, so `v0.21.0+hotfix` would otherwise clear
      #     it and really publish an immutable 0.21.0. `+` is legal in a git
      #     refname, so this is reachable, not theoretical.
      #
      # Those last two are blanket character tests rather than the release job's
      # `-alpha`/`-beta`/`-rc` list, and the difference matters here in a way it
      # does not there. A suffix the list misses (`-pre.1`, `-next.1`, a typo
      # like `-cr.1`) still clears `version-gate`, which compares release cores
      # — so `v0.21.0-pre.1` against a 0.21.0 workspace would really publish the
      # final, immutable 0.21.0 from prerelease code, and the eventual v0.21.0
      # tag would then no-op on crates.io while npm and the GitHub release ship
      # the real thing. Nothing is lost by the broader test: a workspace version
      # carrying either character can never match a core-compared tag, so no
      # such tag can legitimately reach a real publish anyway.
      #
      # Dry runs and prerelease tags still pass through `version-gate` and run
      # the full packaging verification below; they just stop short of
      # uploading.
      REAL_PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true && !contains(github.ref, '-') && !contains(github.ref, '+') }}
    steps:
      # Fail in seconds, not after the verify builds: cargo only discovers a
      # missing token at upload time, minutes of packaging work in.
      - name: Ensure crates.io token is configured
        if: env.REAL_PUBLISH == 'true'
        env:
          TOKEN_SET: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
        run: |
          if [ "$TOKEN_SET" != "true" ]; then
            echo "::error title=CARGO_REGISTRY_TOKEN missing::Add a crates.io API token (scopes: publish-new, publish-update) as the CARGO_REGISTRY_TOKEN repository secret."
            exit 1
          fi

      # SHA-pinned like the release job's actions: this job holds a publish
      # credential, and these two actions decide what source gets packaged and
      # which toolchain publishes it (see the pinning note at the top of this
      # file).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      # No rust-cache here, unlike the build jobs: restored cache artifacts
      # (dependency rlibs, build-script executables) execute during the
      # packaging verification and the cargo-workspaces build below, both of
      # them inside a job that holds a publish credential. Not an injection
      # vector worth accepting to save one release-time build.

      # Packages every publishable crate (bench is `publish = false`) and runs
      # the verify builds, resolving workspace siblings from cargo's local
      # overlay — so this works even before anything exists on the registry.
      #
      # Unconditional, and that is the point: this is the only verification the
      # real publish gets. crates.io uploads are immutable and not atomic, so a
      # packaging defect discovered at crate six leaves five published at a
      # version the run can never complete — and since all eight version in
      # lockstep, the whole workspace has to skip to the next number with that
      # one half-published forever. The skip-already-published resumability
      # below rescues transient faults (a rate limit, a dropped connection),
      # never a deterministic one. Running this first turns that class into a
      # failed job with nothing uploaded.
      #
      # It also runs with no token in the environment, which is what lets the
      # publish step below skip its own verify builds — see there.
      #
      # Safe to run unconditionally only because dry-run mode downgrades an
      # already-published version to `warning: crate X@Y already exists on
      # crates.io index` and still exits 0 (verified against the real registry
      # on cargo 1.97). Were it an error, this step would break exactly the
      # re-run it exists to protect. Note that is dry-run behaviour only — in
      # real mode native workspace publish does refuse, which is the whole
      # reason the publish below goes through cargo-workspaces.
      - name: Verify packaging
        run: cargo publish --workspace --locked --dry-run

      # cargo-workspaces publishes every publishable crate in topological
      # order and unconditionally skips versions that already exist on the
      # registry. Both halves are load-bearing: the order means no
      # hand-maintained crate list to drift when a workspace member is added,
      # and the skip is what makes this step resumable — crates.io publishes
      # are immutable and not atomic, so a run that dies partway (a rate
      # limit, a network fault) leaves some crates published and some not,
      # and the re-run must pick up where the last one stopped rather than
      # choke on the crates that already landed. Native `cargo publish
      # --workspace` covers neither: it refuses to proceed once any member
      # already exists at the target version. All eight names are already
      # reserved on crates.io at 0.0.0 under the offline-protocol maintainers
      # team, so every publish here is a new version of an existing crate —
      # the much stricter brand-new-crate-name rate limit does not apply.
      #
      # Compiled fresh with --locked rather than cached (wrkflw-style
      # actions/cache would be faster): a cached binary executes with the
      # registry token in its environment, the same poisoning vector the
      # missing rust-cache note above declines.
      - name: Install cargo-workspaces
        if: env.REAL_PUBLISH == 'true'
        run: cargo install cargo-workspaces@0.4.2 --locked

      # --publish-as-is (hidden alias: --from-git) publishes the manifests
      # exactly as committed. Without it, `cargo workspaces publish` runs its
      # interactive version-bump/commit/tag flow first, which must never happen
      # here — `version-gate` already established that what is committed is
      # what this tag is supposed to ship.
      #
      # --no-verify, because the verification already ran: the packaging step
      # above builds every crate from the committed manifests, with --locked
      # and with no credential in the environment. Repeating it here would
      # compile build scripts and proc macros — third-party code, at versions
      # this invocation cannot pin (see --locked below) — in a step holding the
      # registry token. That is the same poisoning vector the missing
      # rust-cache and the uncached cargo-workspaces binary above both decline,
      # and declining it twice while accepting it here would be incoherent.
      # Stripped dev-deps only shrink the build, so nothing verified above can
      # break here.
      #
      # Deliberately NOT --locked, unlike every other cargo invocation in this
      # workflow: cargo-workspaces temporarily strips [dev-dependencies] from
      # any crate whose dev-deps name workspace siblings with versions
      # (offline-protocol and offline-protocol-uniffi), and a manifest whose
      # dep set shrank needs a lockfile update, which --locked refuses — so the
      # run would publish six crates and then die on the seventh. The packaging
      # step above keeps --locked, because native workspace publish leaves
      # manifests alone; it, not this step, is where lockfile drift gets caught.
      - name: Publish crates
        if: env.REAL_PUBLISH == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "offline-protocol") | .version')"

          # All workspace crates version in lockstep, and offline-protocol-uniffi
          # sits atop the internal dependency graph — it is what the topological
          # publish below reaches last — so if it is already published at this
          # version, every other crate is too and the whole run is a no-op. Say
          # so as a warning annotation rather than letting eight "skipping"
          # lines scroll by. Since `version-gate` pins the version to the tag,
          # this can only mean a re-run of a release that already published,
          # which is exactly what the skip below exists to make safe — but it is
          # worth saying out loud, because the run reports success either way.
          #
          # Probing the *last* crate rather than offline-protocol is what makes
          # the annotation true during the incident it is read in: a run that
          # died partway leaves the lower crates published and the top one not,
          # and a probe aimed lower would tell the operator resuming it that
          # nothing was left to do while the resume went on to publish.
          #
          # This URL is the one place in the job that names a crate — the
          # publish itself is topological and needs no list — so if a workspace
          # member is ever added *above* offline-protocol-uniffi in the internal
          # dependency graph, this has to move with it or the annotation goes
          # quietly wrong. Nothing else breaks; it is a warning, not a gate.
          url="https://index.crates.io/of/fl/offline-protocol-uniffi"
          if curl -fsS --retry 3 "$url" 2>/dev/null \
            | jq -e --arg v "$VERSION" 'select(.vers == $v)' >/dev/null; then
            echo "::warning title=crates.io publish is a no-op::offline-protocol-uniffi@$VERSION already exists, and it is the last crate this job publishes, so every other crate does too. This run published nothing — expected when re-running a release that already reached crates.io."
          fi

          cargo workspaces publish --publish-as-is --no-verify --yes
