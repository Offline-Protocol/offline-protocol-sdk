name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# CLA Assistant Lite needs to comment on PRs and write to the
# `cla-signatures` branch where signatures are recorded.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/Offline-Protocol/offline-protocol-sdk/blob/main/CLA.md"
          # Signatures are committed to this branch — leave it unprotected.
          branch: "cla-signatures"
          # Bot accounts that don't need to sign. Add new bots here as needed.
          allowlist: dependabot[bot],renovate[bot],bot*
