name: Fuzz

# The C binding's JSON boundary (tools/capi-fuzz): arbitrary method names
# and parameters, the input a C host controls. A panic there is a status in
# the shipped libraries, which unwind, and a crash in a host built with
# `panic = "abort"`, so the target treats a panic, `Internal` and a non-JSON
# result alike as a crash. Nightly and on demand rather than on every pull
# request: a run is
# minutes of nightly-toolchain compute, and what it finds does not depend on
# the change that triggered it.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "How long to fuzz"
        default: "900"

permissions:
  contents: read

jobs:
  capi:
    name: Fuzz the C boundary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SECONDS_TO_RUN: ${{ inputs.seconds || '900' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/capi-fuzz
          shared-key: fuzz-capi

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # The corpus grows run over run; a cache miss starts from the seeds.
      - uses: actions/cache@v4
        with:
          path: tools/capi-fuzz/corpus
          key: capi-fuzz-corpus-${{ github.run_id }}
          restore-keys: capi-fuzz-corpus-

      # No sanitizer: the target calls safe Rust only, and what it looks for
      # is a panic, which libFuzzer catches without one. The fuzz package
      # compiles the FFI crate's source as its own Rust library (that crate
      # builds only the shipped cdylib and staticlib), so no library with
      # unresolved coverage hooks is linked, and the same command runs on
      # macOS for a local session.
      - name: Fuzz
        run: |
          mkdir -p tools/capi-fuzz/corpus/call
          cargo fuzz run --sanitizer none --fuzz-dir tools/capi-fuzz call \
            tools/capi-fuzz/corpus/call tools/capi-fuzz/seeds/call \
            -- -max_total_time="$SECONDS_TO_RUN" -max_len=4096

      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: capi-fuzz-artifacts
          path: tools/capi-fuzz/artifacts/
