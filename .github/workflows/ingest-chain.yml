name: Ingest Chain

# The telemetry uploader trusts only the roots in
# crates/offline-protocol/src/telemetry/pipe/ingest-roots.pem (ADR 0031). When
# the ingest's edge or one of its certificate authorities moves issuance to a
# root outside that file, every shipped SDK stops sending telemetry, and the
# first sign would otherwise be applications' `lastError`. This runs the live
# test against the production ingest daily, so the move is seen here first and
# the new root can ship in a release. Scheduled rather than on every pull
# request: it needs the network, and what it finds does not depend on the
# change that triggered it.

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chain:
    name: Ingest chain validates against the pinned roots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ingest-chain

      - name: Validate the production ingest's chain
        run: >
          cargo test --package offline-protocol --lib --locked
          -- --ignored the_ingest_chain
