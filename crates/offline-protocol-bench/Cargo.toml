[package]
name = "offline-protocol-bench"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
# Criterion harness for the workspace, not a distributable library: it carries no
# per-crate license copy because it is never packaged or published.
publish = false

[lints]
workspace = true

[lib]
bench = false

[[bench]]
name = "message_throughput"
harness = false
path = "../../benches/message_throughput.rs"

[[bench]]
name = "protocol_performance"
harness = false
path = "../../benches/protocol_performance.rs"

[[bench]]
name = "dors_selection"
harness = false
path = "../../benches/dors_selection.rs"

[[bench]]
name = "ble_fragmentation"
harness = false
path = "../../benches/ble_fragmentation.rs"

[[bench]]
name = "telemetry_emission"
harness = false
path = "../../benches/telemetry_emission.rs"

[[bench]]
name = "mls_encryption"
harness = false
path = "../../benches/mls_encryption.rs"

[dependencies]
offline-protocol-core = { workspace = true }
offline-protocol-transport = { workspace = true }
offline-protocol-router = { workspace = true }
offline-protocol-reliability = { workspace = true }
offline-protocol = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# The engine and transport benches drive real sends through `MockTransport`,
# which lives behind the transport crate's `test-utils` feature. Without this
# the benches compile to empty stubs and silently measure nothing; mirrors
# offline-protocol's own dev-dependency.
offline-protocol-transport = { workspace = true, features = ["test-utils"] }
