# The C binding's header, bindings/c/include/offline_protocol.h.
#
# Regenerate with scripts/generate-c-header.sh, which pins the cbindgen
# version; CI runs it with --check. cbindgen is deliberately not a build
# dependency: this is the most-built crate in the repository, and every
# mobile build would pay for a second parser in its build graph to produce a
# file CI can verify once.

language = "C"
include_guard = "OFFLINE_PROTOCOL_H"
cpp_compat = true
documentation = true
documentation_style = "doxy"
usize_is_size_t = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
header = """/*
 * The Offline Protocol SDK, from C.
 *
 * Generated by cbindgen from crates/offline-protocol-uniffi/src/capi. Do not
 * edit: change the Rust and run scripts/generate-c-header.sh.
 *
 * The contract is docs/bridges/c.md. In brief: create an engine from a JSON
 * configuration, drive it with offline_protocol_call, which takes a method
 * named as the local API names it and its parameters as a JSON object, and
 * receive events as JSON. Every string the library hands out is freed with
 * offline_protocol_string_free.
 *
 * Copyright (c) 2025-2026 Offline Protocol, Inc.
 * SPDX-License-Identifier: AGPL-3.0-only (or a commercial license; see LICENSE-COMMERCIAL.md)
 */"""

[enum]
prefix_with_name = true

[parse]
parse_deps = false

[export]
include = ["OfflineProtocolStatus", "OfflineProtocolTransport", "OfflineProtocolStorageStatus"]
