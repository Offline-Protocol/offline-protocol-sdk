[package]
name = "offline-protocol-uniffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
# AGPL-3.0-only requires the license text to accompany the program, and a
# published crate ships on its own. Rather than `license-file = "../../LICENSE"`
# (which makes cargo warn that `license` and `license-file` are redundant on
# every invocation), each publishable crate carries its own byte-identical
# LICENSE copy; cargo packages every git-tracked file under the crate root, so
# it lands in the .crate archive. scripts/check-license-consistency.sh asserts
# the copies never drift.
repository.workspace = true
# Not the workspace's 1.87: UniFFI 0.32's bindgen (a build dependency, through
# uniffi_build) needs askama 0.16, which requires 1.88, and cargo-platform 0.3,
# which requires 1.91. Nothing else depends on this crate, so the library
# crates keep the workspace promise and the MSRV job checks them without it.
rust-version = "1.91"
description = "UniFFI bindings for the Offline Protocol SDK"

[lints]
workspace = true

[dependencies]
offline-protocol = { workspace = true }
offline-protocol-core = { workspace = true }
offline-protocol-router = { workspace = true }
offline-protocol-transport = { workspace = true }
offline-protocol-mls = { workspace = true }
# The C binding's byte strings, which cross as base64 as on the local API.
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Scrubs this side's copy of the store key handed to
# `initialize_mls_with_file_stores`.
zeroize = { workspace = true }
# `log` turns every `tracing` macro in the workspace into a `log` record when
# no subscriber is installed, which is how the core's output reaches the host
# logger in `host_log.rs`; see that module for why.
tracing = { workspace = true, features = ["log"] }
log = "0.4"
uniffi = "0.32"

# The platform loggers the host logger writes to. Only the one for the
# target being built is compiled; a desktop build writes to stderr instead.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = { version = "0.15", default-features = false }

[target.'cfg(target_os = "ios")'.dependencies]
oslog = { version = "0.2", default-features = false, features = ["logger"] }

[dev-dependencies]
offline-protocol-services = { workspace = true }
# `test-utils` routes every telemetry upload into a capturing client, so the
# FFI tests see the bytes without a network or a key.
offline-protocol = { workspace = true, features = ["test-utils"] }
# The wire types the FFI tests parse captured uploads back into, so a body
# the pipe sends is checked against what the ingest binds.
offline-protocol-telemetry-wire = { workspace = true }
# The identity assertion's length floor, which the Android Hello bound
# mirrors and a source guard pins.
offline-protocol-sealed = { workspace = true }

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "offline_protocol_uniffi"

[features]
default = ["capi"]
# The C binding (docs/bridges/c.md): the JSON dispatcher and its `extern "C"`
# functions. On by default, because the desktop libraries the release ships
# are what a C host links. The Android builds turn it off: a cdylib exports
# every `#[no_mangle]` symbol, so nothing can strip the dispatcher behind
# them, and an Android application has no C host to call it. An iOS
# application links the static library with dead stripping, which drops the
# unreferenced exports, so the iOS builds keep the default.
capi = []
