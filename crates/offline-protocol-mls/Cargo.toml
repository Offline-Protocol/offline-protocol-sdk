[package]
name = "offline-protocol-mls"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
# AGPL-3.0-only requires the license text to accompany the program, and a
# published crate ships on its own. Rather than `license-file = "../../LICENSE"`
# (which makes cargo warn that `license` and `license-file` are redundant on
# every invocation), each publishable crate carries its own byte-identical
# LICENSE copy; cargo packages every git-tracked file under the crate root, so
# it lands in the .crate archive. scripts/check-license-consistency.sh asserts
# the copies never drift.
repository.workspace = true
rust-version.workspace = true
description = "MLS (Message Layer Security) integration for end-to-end encryption in the Offline Protocol SDK"

[lints]
workspace = true

[features]
default = []
# Adversarial fixtures for tests in *other* crates: building a leaf that lies
# about its identity needs raw OpenMLS, which the protocol crate deliberately
# does not depend on. Mirrors offline-protocol-transport's `test-utils`.
test-utils = []

[dependencies]
# Shared id-validation policy (storage-key safety)
offline-protocol-core = { workspace = true }

# MLS implementation
openmls = { workspace = true }
openmls_rust_crypto = { workspace = true }
openmls_basic_credential = { workspace = true }
openmls_traits = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Encoding
base64 = { workspace = true }
hex = "0.4"

# Hashing
sha2 = "0.10"

# Ed25519 for signature verification
ed25519-dalek = { version = "3.0", features = ["digest"] }

# UUID for group IDs
uuid = { workspace = true }

# Time handling
chrono = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
