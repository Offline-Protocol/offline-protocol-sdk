[package]
name = "offline-protocol-mls"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MLS (Message Layer Security) integration for end-to-end encryption in the Offline Protocol SDK"

[dependencies]
# Shared id-validation policy (storage-key safety)
offline-protocol-core = { workspace = true }

# MLS implementation
openmls = { workspace = true }
openmls_rust_crypto = { workspace = true }
openmls_basic_credential = { workspace = true }
openmls_traits = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Encoding
base64 = { workspace = true }
hex = "0.4"
bs58 = "0.5"

# Hashing
sha2 = "0.10"

# Ed25519 for signature verification
ed25519-dalek = { version = "3.0", features = ["digest"] }

# UUID for group IDs
uuid = { workspace = true }

# Time handling
chrono = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
