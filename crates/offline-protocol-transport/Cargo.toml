[package]
name = "offline-protocol-transport"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
# AGPL-3.0-only requires the license text to accompany the program, and a
# published crate ships on its own. Rather than `license-file = "../../LICENSE"`
# (which makes cargo warn that `license` and `license-file` are redundant on
# every invocation), each publishable crate carries its own byte-identical
# LICENSE copy; cargo packages every git-tracked file under the crate root, so
# it lands in the .crate archive. scripts/check-license-consistency.sh asserts
# the copies never drift.
repository.workspace = true
rust-version.workspace = true
description = "Transport abstraction layer for the Offline Protocol SDK"

[lints]
workspace = true

[features]
default = []
test-utils = []

[dependencies]
offline-protocol-core = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
thiserror = { workspace = true }
tracing = { workspace = true }
k256 = { workspace = true }
sha2 = { workspace = true }
hkdf = { workspace = true }
rand_core = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]

[lib]
