[package]
name = "mls-interop"
version = "0.0.0"
edition = "2021"
publish = false
description = "Proves the leaf's MLS stack interoperates with the phone's"

# Its own workspace, for the same reason `embedded-footprint` has one: it links
# two independent MLS implementations at once, and neither belongs in the SDK's
# dependency graph.
[workspace]

[dependencies]
# The phone's stack, pinned to exactly what the SDK resolves today. An interop
# claim is about two specific versions, so neither of these floats.
openmls = "=0.7.4"
openmls_rust_crypto = "=0.4.4"
openmls_basic_credential = "0.4"
openmls_traits = "0.4"

# The leaf's stack, in the configuration `embedded-footprint` measures, plus
# `std` because this harness runs on the host.
mls-rs = { version = "=0.56.0", default-features = false, features = [
    "private_message",
    "out_of_order",
    "prior_epoch",
    "by_ref_proposal",
    "std",
] }
mls-rs-crypto-rustcrypto = "=0.22.1"

# The address derivation, the sender-ratchet bounds and the leaf key-package
# policy, taken from the SDK rather than restated here. This harness exists to
# run the phone against the SDK's configuration; a local copy of any of it
# would leave the harness green while it quietly stopped testing that. The
# derivation returns the real `Address` type, so the credential check runs
# against it rather than against a string. The harness is its own cargo
# workspace, so no type check connects the two:
# `the_interop_harness_uses_this_crate_rather_than_its_own_copies` in
# offline-protocol-sealed is what fails if the copies come back.
offline-protocol-sealed = { path = "../../crates/offline-protocol-sealed" }

[profile.release]
debug = false
