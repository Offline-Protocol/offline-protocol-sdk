name: offline_protocol
description: Flutter bindings for the Offline Protocol SDK (offline-first mesh messaging with MLS encryption).
version: 0.31.0
homepage: https://github.com/Offline-Protocol/offline-protocol-sdk
repository: https://github.com/Offline-Protocol/offline-protocol-sdk
issue_tracker: https://github.com/Offline-Protocol/offline-protocol-sdk/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.offlineprotocol.flutter
        pluginClass: OfflineProtocolPlugin
      ios:
        pluginClass: OfflineProtocolPlugin
