group 'com.offlineprotocol.flutter'

buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// Bridge sources have one home (ADR 0025). The compile surface is every
// shared bridge source except the ones the KotlinCompile excludes below name:
// a list of what to leave out, never a list of what to take, so a new shared
// source reaches this plugin without being registered (decision 3).
def bridgeDir = file('../../../react-native/android')
def bridgeJava = bridgeDir.path + '/src/main/java'

// Values the React Native module declares are read from the line that declares
// them, never written again here (decision 5): a copy is right on the day it is
// made and drifts with nothing failing. Each must be declared exactly once.
def moduleBuild = new File(bridgeDir, 'build.gradle').text
def exactlyOne = { String name, String pattern ->
    def found = (moduleBuild =~ pattern).collect { it[1] }
    if (found.size() != 1) {
        throw new GradleException(
            "react-native/android/build.gradle must declare ${name} exactly once (found ${found.size()})")
    }
    found[0]
}
def sdkLevel = { String name ->
    exactlyOne(name, /(?m)^[ \t]*${java.util.regex.Pattern.quote(name)}[ \t]+(\d+)[ \t]*$/).toInteger()
}
def moduleDependency = { String module ->
    def quoted = java.util.regex.Pattern.quote(module)
    exactlyOne(module, /(?m)^[ \t]*implementation[ \t(]+['"]${quoted}:([^'"@]+)(?:@aar)?['"]/)
}
def rnPackage = new groovy.json.JsonSlurper().parse(file('../../../react-native/package.json'))
version rnPackage.version

android {
    namespace 'com.offlineprotocol'
    compileSdk sdkLevel('compileSdk')

    defaultConfig {
        minSdkVersion sdkLevel('minSdkVersion')
        consumerProguardFiles bridgeDir.path + '/consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java {
                srcDirs bridgeJava, 'src/main/kotlin'
            }
            def stagedJni = file('src/main/jniLibs')
            def rnJni = file(bridgeDir.path + '/src/main/jniLibs')
            jniLibs.srcDirs(
                (stagedJni.exists() && stagedJni.list()?.length > 0) ? stagedJni : rnJni
            )
        }
    }
}

// The Kotlin plugin compiles every `.kt` under [bridgeJava] unless excluded here.
// These need React, or are transports the plugin does not host yet. A Rust guard
// (flutter_android_excludes_name_real_files) refuses a name that matches no file,
// which is a rename nobody carried over and would let the renamed file in.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    exclude('com/offlineprotocol/OfflineProtocolModule.kt')
    exclude('com/offlineprotocol/OfflineProtocolPackage.kt')
    exclude('com/offlineprotocol/MeshHeadlessWakeService.kt')
    exclude('com/offlineprotocol/MeshForegroundService.kt')
    exclude('com/offlineprotocol/StickyEventBuffer.kt')
    exclude('com/offlineprotocol/StickyEventDispatcher.kt')
    exclude('com/offlineprotocol/MeshWakePolicy.kt')
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "net.java.dev.jna:jna:${moduleDependency('net.java.dev.jna:jna')}@aar"
    implementation "androidx.security:security-crypto:${moduleDependency('androidx.security:security-crypto')}"
    implementation "com.squareup.okhttp3:okhttp:${moduleDependency('com.squareup.okhttp3:okhttp')}"
}
