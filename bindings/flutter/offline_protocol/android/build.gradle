group 'com.offlineprotocol.flutter'
version '0.29.0'

buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// Bridge sources have one home (ADR 0025). Compile surface: Internet, BLE,
// Wi‑Fi Direct, event replay, foreground reconnect, teardown helpers.
def bridgeDir = file('../../../react-native/android')
def bridgeJava = bridgeDir.path + '/src/main/java'

// Keep `pr3KotlinIncludes`, KotlinCompile excludes, and ios/offline_protocol.podspec
// `pr3_bridge_swift` aligned (Rust guards pin both lists and docs/bridges/flutter.md).
def pr3KotlinIncludes = [
    'uniffi/**/*.kt',
    'com/offlineprotocol/ProtocolConfigParser.kt',
    'com/offlineprotocol/InitialRuntimeConfigApplier.kt',
    'com/offlineprotocol/JsonExtensions.kt',
    'com/offlineprotocol/InternetTransportBootstrap.kt',
    'com/offlineprotocol/EncryptionConfigReader.kt',
    'com/offlineprotocol/MeshRelayConfigReader.kt',
    'com/offlineprotocol/CustodyConfigReader.kt',
    'com/offlineprotocol/MlsSecureStorage.kt',
    'com/offlineprotocol/ProtocolStateStorage.kt',
    'com/offlineprotocol/StorageNamespace.kt',
    'com/offlineprotocol/LegacyStoreAdoption.kt',
    'com/offlineprotocol/TransportManager.kt',
    'com/offlineprotocol/InternetManager.kt',
    'com/offlineprotocol/RelayControlOpTranslator.kt',
    'com/offlineprotocol/RelayAnswerPrefixes.kt',
    'com/offlineprotocol/RelayGroupSnapshotBridge.kt',
    'com/offlineprotocol/RelayRateLimiter.kt',
    'com/offlineprotocol/RelayTimestamps.kt',
    'com/offlineprotocol/LegacyRelayMessage.kt',
    'com/offlineprotocol/AddressDeclarationPolicy.kt',
    'com/offlineprotocol/ForcedPresenceCheckQueue.kt',
    'com/offlineprotocol/RecipientInFlightTracker.kt',
    'com/offlineprotocol/SupersededLatchPolicy.kt',
    'com/offlineprotocol/GatewayAttachPolicy.kt',
    'com/offlineprotocol/GatewayVerdictTracker.kt',
    'com/offlineprotocol/PeerIdentityBinding.kt',
    'com/offlineprotocol/MonotonicClock.kt',
    'com/offlineprotocol/SocketGenerationTracker.kt',
    'com/offlineprotocol/WriteStallWatchdog.kt',
    'com/offlineprotocol/ProtocolErrorBridge.kt',
    'com/offlineprotocol/PresenceWatchPolicy.kt',
    'com/offlineprotocol/EventReplayRing.kt',
    'com/offlineprotocol/ForegroundReconnectPolicy.kt',
    'com/offlineprotocol/TeardownSequence.kt',
    'com/offlineprotocol/WifiDirectManager.kt',
    'com/offlineprotocol/WifiDirectGroupFormation.kt',
    'com/offlineprotocol/LanPeerDiscovery.kt',
    'com/offlineprotocol/LanPeerState.kt',
    'com/offlineprotocol/PeerStreamFraming.kt',
    'com/offlineprotocol/PeerStreamSockets.kt',
    'com/offlineprotocol/PeerStreamDialPolicy.kt',
    'com/offlineprotocol/BleAppTag.kt',
    'com/offlineprotocol/BleDensityPolicy.kt',
    'com/offlineprotocol/BleDiscoveryBootstrapPolicy.kt',
    'com/offlineprotocol/BleHelloPolicy.kt',
    'com/offlineprotocol/BleMessageNotificationPolicy.kt',
    'com/offlineprotocol/BleServiceInstanceSelection.kt',
    'com/offlineprotocol/ble/**/*.kt',
    'com/offlineprotocol/mesh/**/*.kt',
]

android {
    namespace 'com.offlineprotocol'
    compileSdk 34

    defaultConfig {
        minSdkVersion 24
        consumerProguardFiles bridgeDir.path + '/consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java {
                srcDirs bridgeJava, 'src/main/kotlin'
                pr3KotlinIncludes.each { include it }
            }
            jniLibs.srcDirs bridgeDir.path + '/src/main/jniLibs'
        }
    }
}

// The Kotlin plugin compiles every `.kt` under [bridgeJava] unless excluded here.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    exclude('com/offlineprotocol/OfflineProtocolModule.kt')
    exclude('com/offlineprotocol/OfflineProtocolPackage.kt')
    exclude('com/offlineprotocol/MeshHeadlessWakeService.kt')
    exclude('com/offlineprotocol/MeshForegroundService.kt')
    exclude('com/offlineprotocol/ReticulumManager.kt')
    exclude('com/offlineprotocol/NostrManager.kt')
    exclude('com/offlineprotocol/NostrQueryTracker.kt')
    exclude('com/offlineprotocol/StickyEventBuffer.kt')
    exclude('com/offlineprotocol/StickyEventDispatcher.kt')
    exclude('com/offlineprotocol/MeshWakePolicy.kt')
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'net.java.dev.jna:jna:5.19.1@aar'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.lifecycle:lifecycle-common:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'
}
