[build-system]
# setuptools >=77 supports PEP 639 (SPDX `license` string + `license-files`).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-protocol-sdk"
version = "0.28.0"
description = "Python bindings for the Offline Protocol SDK — offline-first mesh networking with MLS encryption"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSE-COMMERCIAL.md", "THIRD-PARTY-NOTICES.md", "EXPORT.md"]
requires-python = ">=3.10"
authors = [{ name = "Offline Protocol, Inc." }]
keywords = ["offline", "messaging", "p2p", "mesh", "ble", "mls", "encryption"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Communications",
    "Topic :: Security :: Cryptography",
]

# Audited dependencies — see plan for supply chain security audit results.
# Upper bounds prevent surprise major-version upgrades.
dependencies = [
    "bleak>=1.1.1,<4",
    "bless>=0.3,<1.0; sys_platform != 'win32'",
    "websockets>=12.0,<17.0",
    "keyring>=25.0,<26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pip-audit>=2.7",
    # Not optional for the suite: the live DNS-SD round trip in
    # test_peer_stream_manager.py is the only check that a published record
    # resolves, and it skips without this.
    "zeroconf>=0.140,<0.160",
    # The HTTP front's suite: tests/http_front skips without it.
    "aiohttp>=3.14,<4",
]
# LAN discovery for the peer-stream transport (DNS-SD, `PeerStreamManager`).
# Imported lazily and only when a manager asks to advertise or discover, so
# the base install's audited dependency set is unchanged. python-zeroconf is
# LGPL-2.1: it is a runtime dependency the user installs from PyPI, never
# bundled in the wheel.
lan = [
    "zeroconf>=0.140,<0.160",
    # Imported directly to list the interface addresses a record publishes;
    # zeroconf depends on it too. MIT.
    "ifaddr>=0.2,<1",
]
# The HTTP front (`offline_protocol_sdk.http_front`, `offline-protocol-service
# --http`): an HTTP server for applications that do not use the SDK, and the
# client it calls their callbacks with. Imported only when a front starts, so
# the base install's audited dependency set is unchanged. aiohttp is
# Apache-2.0 AND MIT.
http = [
    "aiohttp>=3.14,<4",
]

[project.scripts]
# The reference server for the local API (docs/spec/local-api.md): one
# engine, served to local applications over a Unix domain socket.
offline-protocol-service = "offline_protocol_sdk.local_api.cli:main"
# The HTTP front on its own, against a service already running.
offline-protocol-http-front = "offline_protocol_sdk.http_front.cli:main"

[project.urls]
Homepage = "https://github.com/Offline-Protocol/offline-protocol-sdk"
Repository = "https://github.com/Offline-Protocol/offline-protocol-sdk"
Issues = "https://github.com/Offline-Protocol/offline-protocol-sdk/issues"

[tool.setuptools.packages.find]
include = ["offline_protocol_sdk*"]

[tool.setuptools.package-data]
offline_protocol_sdk = ["*.dylib", "*.so", "*.dll", "libuniffi.*", "uniffi.dll"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
