<!doctype html>
<meta charset="utf-8">
<title>running</title>
<pre id="log"></pre>
<script type="module">
// Two nodes with no tab carrier, linked only by a WebRTC data channel set up
// from two codes and no server. Checks an MLS session, an encrypted direct
// message, a group, game-rate group traffic (with what it costs the durable
// store), and that closing the connection reports the peer lost. The title
// ends as PASS or FAIL: <step>.
import { OfflineNode, WebRtcCarrier } from "../src/index.js";
import { log, waitFor, invite, run } from "./common.js";

const appId = `web-webrtc-${crypto.randomUUID()}`;
const RATE_HZ = 10;
const SECONDS = 3;

await run(async (step) => {
  const [a, b] = await Promise.all([
    OfflineNode.start({ appId, profile: "alice", tabs: false }),
    OfflineNode.start({ appId, profile: "bob", tabs: false }),
  ]);
  log(`a ${a.address}\nb ${b.address}`);

  step.name = "signalling";
  const [ra, rb] = [new WebRtcCarrier(a), new WebRtcCarrier(b)];
  const offer = await ra.offer();
  const answer = await rb.answer(offer.code);
  await offer.accept(answer.code);
  log(`offer code ${offer.code.length} chars, answer ${answer.code.length}`);

  step.name = "session";
  await Promise.all([
    waitFor(a, "secure_session_established", (e) => e.peer_id === b.address),
    waitFor(b, "secure_session_established", (e) => e.peer_id === a.address),
  ]);
  log("session established over WebRTC");

  step.name = "direct message";
  const received = waitFor(b, "message_received", (e) => e.content === "over a data channel");
  await a.sendMessage(b.address, "over a data channel");
  const message = await received;
  if (message.encrypted !== true || message.sender !== a.address) {
    throw new Error(`unexpected message ${JSON.stringify(message)}`);
  }
  log("direct message arrived encrypted");

  step.name = "large message";
  // Larger than one chunk: the carrier cuts it and the engine joins it.
  const big = "x".repeat(100 * 1024);
  const bigReceived = waitFor(b, "message_received", (e) => e.content === big);
  await a.sendMessage(b.address, big);
  await bigReceived;
  log("a 100 KiB message crossed in chunks");

  step.name = "group";
  const group = await a.createGroup("pong");
  const joined = waitFor(b, "group_member_added", (e) => e.group_id === group.group_id);
  await invite(a, group.group_id, b.address);
  await joined;

  step.name = "game rate";
  const sent = new Map();
  const latencies = [];
  b.addEventListener("group_message_received", ({ detail }) => {
    const at = sent.get(detail.content);
    if (at !== undefined) latencies.push(performance.now() - at);
  });
  const before = await a.stats();
  const total = RATE_HZ * SECONDS;
  for (let n = 0; n < total; n++) {
    const content = `state ${n}`;
    sent.set(content, performance.now());
    await a.sendGroupMessage(group.group_id, content);
    await new Promise((r) => setTimeout(r, 1000 / RATE_HZ));
  }
  const deadline = performance.now() + 10000;
  while (latencies.length < total && performance.now() < deadline) {
    await new Promise((r) => setTimeout(r, 100));
  }
  const after = await a.stats();
  latencies.sort((x, y) => x - y);
  const pct = (p) => latencies[Math.min(latencies.length - 1, Math.floor(p * latencies.length))]?.toFixed(1);
  const flushes = (after.mls.flushes + after.protocol_state.flushes) -
    (before.mls.flushes + before.protocol_state.flushes);
  log(`${RATE_HZ} Hz for ${SECONDS} s: ${latencies.length}/${total} delivered, ` +
    `p50 ${pct(0.5)} ms, p95 ${pct(0.95)} ms; sender flushes ${flushes} ` +
    `(${(flushes / SECONDS).toFixed(1)}/s)`);
  if (latencies.length < total) throw new Error(`only ${latencies.length} of ${total} arrived`);

  step.name = "loss";
  const lost = waitFor(a, "neighbor_lost", (e) => e.peer_id === b.address);
  rb.close();
  await lost;
  log("closing the connection reported the peer lost");

  await Promise.all([a.stop(), b.stop()]);
});
</script>
