[package]
name = "offline-protocol-web"
version = "0.1.0"
edition = "2021"
authors = ["Offline Protocol Contributors"]
license = "MIT OR Apache-2.0"
description = "WebAssembly bindings for the Offline Protocol SDK"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
offline-protocol = { path = "../../crates/offline-protocol" }
offline-protocol-core = { path = "../../crates/offline-protocol-core" }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
console_error_panic_hook = "0.1"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true

