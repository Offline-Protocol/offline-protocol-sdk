apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def reactNative = new File("$projectDir/../node_modules/react-native")
// Only use the legacy local Maven repository when it actually exists.
// Newer React Native packages keep sources under ReactAndroid/ and do not
// publish an `android/` Maven repo, so checking only the package directory
// produces an unversioned `react-android` dependency in the standalone
// harness.
def reactNativeExists = new File(reactNative, "android").exists()

android {
    namespace 'com.offlineprotocol'
    compileSdk 34

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        // Ship FFI keep rules to consumers so R8/ProGuard in their release
        // builds does not obfuscate the JNA/uniffi bindings and kill the
        // mesh transport. See consumer-rules.pro for the rationale.
        consumerProguardFiles 'consumer-rules.pro'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
    if (reactNativeExists) {
        maven {
            // All of React Native (JS, Android binaries) is installed from npm
            url "$projectDir/../node_modules/react-native/android"
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib"

    // JNA required for UniFFI-generated Kotlin bindings.
    // Keep >= 5.17.0: earlier libjnidispatch.so is not 16 KB page-aligned on
    // every ABI (Google Play requirement) and 5.17.0 fixed runtime crashes on
    // 16 KB-page devices (java-native-access/jna#1618).
    implementation 'net.java.dev.jna:jna:5.19.1@aar'

    // OkHttp for WebSocket support in InternetManager
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // AndroidX Security Crypto for MlsSecureStorage
    implementation 'androidx.security:security-crypto:1.1.0'

    if (reactNativeExists) {
        implementation 'com.facebook.react:react-android'
    } else {
        // For standalone build or testing
        compileOnly 'com.facebook.react:react-android:0.87.0'
    }

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
    // NotificationCompat reaches the production classpath transitively through
    // react-android, which is compileOnly in the standalone/CI harness — so the
    // JVM tests have to bring it themselves. Test-only: consumers keep getting
    // it from the host app. Hold at 1.13.x, the last line that builds against
    // compileSdk 34.
    testImplementation 'androidx.core:core:1.13.1'
    // Real org.json for JVM unit tests (the android.jar org.json is a stub
    // that throws) — needed by RelayControlOpTranslatorTest.
    testImplementation 'org.json:json:20260719'
}
