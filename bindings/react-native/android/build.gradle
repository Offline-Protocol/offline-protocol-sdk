apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def reactNative = new File("$projectDir/../node_modules/react-native")
def reactNativeExists = reactNative.exists()

android {
    namespace 'com.offlineprotocol'
    compileSdk 34

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    // UniFFI libraries are pre-built Rust .so files, no CMake needed
    // externalNativeBuild {
    //    cmake {
    //        path "src/main/cpp/CMakeLists.txt"
    //    }
    // }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
    if (reactNativeExists) {
        maven {
            // All of React Native (JS, Android binaries) is installed from npm
            url "$projectDir/../node_modules/react-native/android"
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    
    // JNA required for UniFFI-generated Kotlin bindings
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    
    // OkHttp for WebSocket support in InternetManager
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    
    // AndroidX Security Crypto for MlsSecureStorage
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    
    if (reactNativeExists) {
        implementation 'com.facebook.react:react-android'
    } else {
        // For standalone build or testing
        compileOnly 'com.facebook.react:react-android:0.76.0'
    }
}

