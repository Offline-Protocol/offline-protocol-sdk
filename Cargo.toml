[workspace]
resolver = "2"
members = [
    "crates/offline-protocol-core",
    "crates/offline-protocol-transport",
    "crates/offline-protocol-router",
    "crates/offline-protocol-reliability",
    "crates/offline-protocol-mls",
    "crates/offline-protocol-services",
    "crates/offline-protocol",
    "crates/offline-protocol-uniffi",
    "crates/offline-protocol-bench",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Offline Protocol Contributors"]
# Dual-licensed: AGPL-3.0-only for open-source use, with a separate commercial
# license offered out-of-band (see LICENSE-COMMERCIAL.md). The SPDX field carries
# only the open-source identifier because the commercial offer is not an
# SPDX-recognized license — do not change to "AGPL-3.0-only OR LicenseRef-..."
# without confirming downstream cargo-deny configurations expect that form.
license = "AGPL-3.0-only"
repository = "https://github.com/Offline-Protocol/offline-protocol-sdk"
rust-version = "1.87"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Async runtime (for future use)
tokio = { version = "1.35", features = ["full"] }

# Logging
tracing = "0.1"

# FFI
cbindgen = "0.26"

# Benchmarking
criterion = "0.5"

# MLS (Message Layer Security)
openmls = "0.7"
openmls_rust_crypto = "0.4"
openmls_basic_credential = "0.4"
openmls_traits = "0.4"

# Encoding
base64 = "0.22"
hex = "0.4"

# Crypto
k256 = { version = "0.13", features = ["schnorr"] }
sha2 = "0.10"
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"

# Internal dependencies
offline-protocol-core = { path = "crates/offline-protocol-core" }
offline-protocol-transport = { path = "crates/offline-protocol-transport" }
offline-protocol-router = { path = "crates/offline-protocol-router" }
offline-protocol-reliability = { path = "crates/offline-protocol-reliability" }
offline-protocol-mls = { path = "crates/offline-protocol-mls" }
offline-protocol-services = { path = "crates/offline-protocol-services" }
offline-protocol = { path = "crates/offline-protocol" }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
strip = true

[profile.minisize]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
inherits = "release"

