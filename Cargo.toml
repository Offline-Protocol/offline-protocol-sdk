[workspace]
resolver = "2"
members = [
    "crates/offline-protocol-core",
    "crates/offline-protocol-transport",
    "crates/offline-protocol-router",
    "crates/offline-protocol-reliability",
    "crates/offline-protocol",
    "crates/offline-protocol-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Offline Protocol Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/offline-protocol/sdk"
rust-version = "1.70"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Async runtime (for future use)
tokio = { version = "1.35", features = ["full"] }

# FFI
cbindgen = "0.26"

# Benchmarking
criterion = "0.5"

# Internal dependencies
offline-protocol-core = { path = "crates/offline-protocol-core" }
offline-protocol-transport = { path = "crates/offline-protocol-transport" }
offline-protocol-router = { path = "crates/offline-protocol-router" }
offline-protocol-reliability = { path = "crates/offline-protocol-reliability" }
offline-protocol = { path = "crates/offline-protocol" }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
strip = true

[profile.minisize]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

